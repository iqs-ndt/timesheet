<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>QInsight · Comp-off approval</title>
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<style>
@font-face{font-family:'QI Calibri';src:local('Calibri'),url(https://cdn.jsdelivr.net/npm/@fontsource/carlito@5.3.0/files/carlito-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'QI Calibri';src:local('Calibri Bold'),local('Calibri-Bold'),url(https://cdn.jsdelivr.net/npm/@fontsource/carlito@5.3.0/files/carlito-latin-700-normal.woff2) format('woff2');font-weight:600 900;font-display:swap}

  :root{--ink:#2c3e50;--navy:#0e2841;--muted:#5a6a7a;--line:#dde3ea;--bg:#f8f9fb;--orange:#e97132;--amber:#f59a35;--teal2:#156082;--green:#1f8a5b;--red:#c0392b}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'QI Calibri',Calibri,Carlito,Arial,sans-serif}
  button,input,textarea{font:inherit}
  [hidden]{display:none!important}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}
  header{background:#fff;box-shadow:0 1px 0 var(--line);position:relative;padding:20px 0 12px}
  .cb{position:absolute;display:block}.cb::before,.cb::after{content:"";position:absolute;display:block}
  .cb-tl{left:0;top:0}.cb-tl::before{left:0;top:0;width:110px;height:7px;background:var(--navy)}.cb-tl::after{left:0;top:7px;width:74px;height:5px;background:var(--amber)}
  .hrow{display:flex;align-items:center;gap:12px}.brand{height:30px}
  .ttl{font-weight:700;color:var(--navy);font-size:17px}.ttl::after{content:"";display:block;width:28px;height:3px;background:var(--orange);margin-top:4px}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  main{padding:14px 0 120px}
  .card{background:#fff;border:1px solid #e6ebf0;border-radius:12px;box-shadow:-3px 3px 13px rgba(0,0,0,.05);padding:14px;margin-bottom:12px}
  h2{margin:0 0 4px;color:var(--navy);font-size:20px}
  h3{margin:0 0 8px;color:var(--navy);font-size:15px}
  .st{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;vertical-align:middle;margin-left:6px}
  .st-p{background:#fff5df;color:#7a5508}.st-a{background:#e8f1fb;color:#174f86}.st-r{background:#fdecea;color:#8e2a1f}.st-d{background:#e7f6ef;color:#17694a}
  .kv{width:100%;border-collapse:collapse}.kv td{padding:6px 0;border-bottom:1px solid #eef2f5;vertical-align:top}.kv td:first-child{color:var(--muted);width:38%;padding-right:10px}.kv td:last-child{font-weight:600}
  .banner{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}.warn{background:#fff5df;color:#7a5508}.err{background:#fdecea;color:#8e2a1f}.ok{background:#e7f6ef;color:#17694a}.info{background:#eef4f8;color:#2c5566}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{background:var(--navy);color:#fff;text-align:left;padding:7px 8px;font-size:12.5px}.tbl td{padding:7px 8px;border-bottom:1px solid #eef2f5;vertical-align:top}
  .tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
  .muted{color:var(--muted);font-size:13px}
  .rc{display:inline-flex;align-items:center;gap:4px;border:1px solid #c9d6e1;background:#fff;border-radius:7px;padding:3px 8px;font-size:12.5px;font-weight:700;color:var(--teal2);margin:2px 4px 2px 0;cursor:pointer}
  .nr{color:#b3541e;font-size:12px;font-weight:600}
  .trip{border-left:5px solid var(--orange);padding-left:10px;margin:14px 0 6px}
  .sum table{border-collapse:collapse}.sum td{padding:6px 0;font-size:14.5px}.sum td:last-child{text-align:right;font-weight:700;white-space:nowrap}.sum .tot td{border-top:2px solid var(--navy);color:var(--navy);font-size:16px;padding-top:9px}.sum .net td{color:var(--orange);font-size:16px}
  .act h3{margin-bottom:10px}
  .f{display:block;margin-bottom:10px}.f span{display:block;font-size:13px;font-weight:700;color:#3d5164;margin-bottom:4px}
  .f input,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:15px;background:#fff}
  .f textarea{min-height:70px;resize:vertical}
  .amts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
  .btns{display:flex;gap:10px;margin-top:6px}.btns button{flex:1;border:0;border-radius:11px;padding:14px;font-weight:700;font-size:16px;color:#fff;cursor:pointer}
  .approve{background:var(--green)}.reject{background:var(--red)}.paybtn{background:var(--navy)}
  .btns button:disabled{opacity:.6}
  #modal{position:fixed;inset:0;background:rgba(10,20,30,.85);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
  #modal img{max-width:100%;max-height:86vh;border-radius:8px;background:#fff}
  #modal button{position:absolute;top:12px;right:14px;border:0;background:#fff;border-radius:99px;width:40px;height:40px;font-size:22px;cursor:pointer}
  .center{text-align:center;padding:60px 20px;color:var(--muted)}
  @media print{.act,#modal{display:none!important}}
  .units{margin:6px 0 0;padding:0;list-style:none}.units li{padding:5px 0;border-bottom:1px solid #eef2f5;font-size:14px}.units li:last-child{border:0}
  .units .tm{display:inline-block;min-width:96px;color:var(--muted);font-variant-numeric:tabular-nums}
  .hl{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #eef2f5;font-size:14px}.hl:last-child{border:0}
</style>
</head>
<body>
<header><i class="cb cb-tl"></i><div class="wrap hrow"><img class="brand" src="logo.png" alt="QInsight Consol Pvt Ltd"><div><div class="ttl" id="ttl">Comp-off approval</div><div class="sub" id="sub"></div></div></div></header>
<main class="wrap" id="main"><div class="center">Loading…</div></main>
<script>
(function () {
  'use strict';
  var API = (window.QTS_CONFIG || {}).API_URL || '';
  var key = new URLSearchParams(location.search).get('k') || '';
  var V = null, main = document.getElementById('main');
  var DN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pretty(s, short) { if (!s) return ''; var p = s.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); return (short ? DN[d.getUTCDay()].slice(0, 3) : DN[d.getUTCDay()]) + ', ' + (+p[2]) + ' ' + MN[+p[1] - 1] + ' ' + p[0]; }
  function stCls(s) { return /pending/i.test(s) ? 'st-p' : /approved|used/i.test(s) ? 'st-d' : /reject/i.test(s) ? 'st-r' : 'st-a'; }
  function api(action, extra) {
    if (!API) return Promise.reject(new Error('This page is not configured (config.js).'));
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action, key: key }, extra || {})), redirect: 'follow' })
      .catch(function () { throw new Error('Could not reach the server. Check your internet connection and try again.'); })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Something went wrong'); return j; });
  }
  function render(msg) {
    var q = V.req, d = V.day, h = '';
    document.getElementById('sub').textContent = q.no + ' · ' + V.name;
    if (msg) h += '<div class="banner ' + msg[0] + '">' + msg[1] + '</div>';
    h += '<div class="card"><h2>' + esc(V.name) + '<span class="st ' + stCls(q.status) + '">' + esc(q.status) + '</span></h2>' +
      '<div class="muted">' + esc(V.dept) + ' · request ' + esc(q.no) + ' · sent ' + esc(String(q.requested).slice(0, 16)) + '</div>' +
      '<table class="kv" style="margin-top:10px"><tr><td>Day worked</td><td>' + esc(pretty(q.worked)) + '</td></tr><tr><td>Why it qualifies</td><td>' + esc(q.reason) + '</td></tr>' +
      '<tr><td>Hours logged that day</td><td>' + esc(d ? d.hours : q.hours) + ' h <span class="muted">(' + V.minHours + ' h or more needed)</span></td></tr>' +
      '<tr><td>If approved</td><td>1 comp-off day, usable until ' + esc(pretty(addDays(q.worked, V.expiryDays))) + '</td></tr>' +
      '<tr><td>Current comp-off balance</td><td>' + esc(V.balance) + ' day' + (V.balance === 1 ? '' : 's') + '</td></tr></table></div>';
    if (q.status === 'Withdrawn') h += '<div class="banner warn">' + esc(V.name.split(' ')[0]) + ' withdrew this request. Nothing to decide.</div>';
    else if (q.status === 'Rejected') h += '<div class="banner err">Rejected on ' + esc(String(q.decided).slice(0, 10)) + (q.note ? ': “' + esc(q.note) + '”' : '') + '</div>';
    else if (q.status !== 'Pending') h += '<div class="banner ok">Approved on ' + esc(String(q.decided).slice(0, 10)) + (q.note ? ': “' + esc(q.note) + '”' : '') + '. Usable until ' + esc(pretty(q.expires)) + '.</div>';
    if (d) {
      h += '<div class="card"><h3>What was logged on ' + esc(pretty(q.worked, true)) + '</h3><div class="muted">' + esc(d.half ? d.workType + ' + half ' + d.type.toLowerCase() : d.type) + (d.invoiceable ? ' · invoiceable: ' + esc(d.invoiceable) : '') + '</div>' +
        '<ul class="units">' + (d.units || []).map(function (u) { return '<li><span class="tm">' + esc(u.start) + '–' + esc(u.end) + '</span> ' + esc(u.text).replace(/\n/g, '<br>') + '</li>'; }).join('') + '</ul>' +
        (d.client ? '<div class="muted" style="margin-top:8px"><b>Invoiceable work:</b> ' + esc(d.client).replace(/\n/g, ' · ') + '</div>' : '') +
        (d.summary ? '<div class="muted" style="margin-top:6px"><b>Challenge noted:</b> ' + esc(d.summary) + '</div>' : '') +
        (d.english ? '<div class="muted" style="margin-top:6px"><b>In English (auto-translated):</b><br>' + esc(d.english).replace(/\n/g, '<br>') + '</div>' : '') + '</div>';
    } else h += '<div class="banner warn">The log for this day is no longer in the timesheet.</div>';
    if (V.history && V.history.length) h += '<div class="card"><h3>Recent comp-offs</h3>' + V.history.map(function (x) {
      return '<div class="hl"><span>' + esc(pretty(x.worked, true)) + ' · ' + esc(x.reason) + '</span><span><span class="st ' + stCls(x.status) + '">' + esc(x.status) + '</span></span></div>'; }).join('') + '</div>';
    if (q.status === 'Pending') h += '<div class="card act"><h3>Your decision</h3><label class="f"><span>Note to ' + esc(V.name.split(' ')[0]) + ' (needed if you reject)</span><textarea id="note" maxlength="500"></textarea></label>' +
      '<div class="btns"><button type="button" class="approve" id="ap">Approve</button><button type="button" class="reject" id="rj">Reject</button></div>' +
      '<p class="muted" style="margin:10px 0 0">' + esc(V.name.split(' ')[0]) + ' and HR get an email with your decision.</p></div>';
    main.innerHTML = h;
    var ap = document.getElementById('ap'), rj = document.getElementById('rj');
    if (ap) ap.onclick = function () { decide('Approved'); };
    if (rj) rj.onclick = function () { decide('Rejected'); };
  }
  function addDays(s, n) { var p = s.split('-'), d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]) + n * 864e5); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
  function decide(dec) {
    var note = (document.getElementById('note').value || '').trim();
    if (dec === 'Rejected' && !note) { document.getElementById('note').focus(); return alertMsg('Please write a short reason for rejecting.'); }
    Array.prototype.forEach.call(document.querySelectorAll('.btns button'), function (b) { b.disabled = true; });
    api('cvDecide', { decision: dec, note: note }).then(function () { return api('cvGet'); }).then(function (r) {
      V = r.view; render(['ok', dec === 'Approved' ? 'Approved. ' + esc(V.name.split(' ')[0]) + ' and HR have been emailed.' : 'Rejected. ' + esc(V.name.split(' ')[0]) + ' and HR have been emailed.']);
    }).catch(function (e) { alertMsg(e.message); Array.prototype.forEach.call(document.querySelectorAll('.btns button'), function (b) { b.disabled = false; }); });
  }
  function alertMsg(m) { var b = document.getElementById('errb'); if (!b) { b = document.createElement('div'); b.id = 'errb'; b.className = 'banner err'; main.insertBefore(b, main.firstChild); } b.textContent = m; window.scrollTo(0, 0); }
  if (!key) { main.innerHTML = '<div class="center">This link is incomplete. Open it again from the email.</div>'; return; }
  api('cvGet').then(function (r) { V = r.view; render(); }).catch(function (e) { main.innerHTML = '<div class="center">' + esc(e.message) + '</div>'; });
})();
</script>
</body>
</html>
